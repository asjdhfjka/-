# ============================================================
# 领域配置模板 —— 接入一所新学校，只需要复制本文件并改名
# ============================================================
#
# 用法：
#   1. 复制本文件为 <学校代号>.yaml，例如 gdut.yaml / scut.yaml / sysu.yaml
#   2. 按下面注释填写
#   3. 启动时指定：set DOMAIN_NAME=<学校代号>
#      或改 config.py 里 DOMAIN_NAME 的默认值
#
# 全流程不需要改动任何一行 Python 代码。
#
# 为什么这样设计：
#   改造前，「四级报名费只允许引用《全国大学英语四、六级考试报名》文档」
#   这类校规是以自然语言写死在 main.py 的作答提示词里的，
#   换一所学校必须改代码，而且改完没有任何地方能核对是否改全了。
#   现在这些内容全部落在这份 YAML 里，可 diff、可评审、可版本管理。
# ============================================================

name: 某某大学
alias: [某某大]

# 学生被引导去咨询的部门名，会出现在「找不到时请咨询 XXX」这类口径里
contact_hint: 教务处

# ------------------------------------------------------------
# 业务领域清单：键是规范领域名，值是给模型的判断线索
#
# 这份清单决定「文档入库时能被归到哪些领域」。它原来硬编码在 main.py 里，
# 是「换学校零改代码」的最后一处漏网，现已移到这里。
# 填法：<领域名>: <该领域常见审查要点>
# ------------------------------------------------------------
domains:
  奖学金评定: 奖学金申请资格、绩点要求、排名要求、材料清单、评审流程
  请假管理: 请假时长、审批层级、请假事由、佐证材料、销假要求
  学生干部: 职位分类、任职时长、表现要求、证明材料
  违纪处分: 违纪行为、处分等级、申诉流程、记录影响
  团员推优: 推优条件、团员资格、评议流程、票数要求
  综合素质测评: 体质测试、挂科情况、第二课堂时长、品德表现
  转专业申请: 转专业条件、成绩要求、申请流程
  宿舍管理: 入住条件、退宿流程、违纪处理
  助学贷款: 申请资格、家庭经济困难认定、还款方式

# ------------------------------------------------------------
# 领域别名表：{模型可能输出的写法: 规范名}
# 用于兜住「入库时识别成 A、审查时识别成 B」的漂移。
# 不确定就留空 {} —— 规则引擎本身还会做一次「互含」匹配。
# ------------------------------------------------------------
domain_aliases:
  奖学金申请: 奖学金评定
  推优: 团员推优

# 可选：材料识别领域没有独立规则时，改用另一个已配置领域的规则。
rule_domain_fallbacks: {}

# ------------------------------------------------------------
# 场景约束：互斥的办事事项，防止模型把两件事混为一谈
#
# 这是本文件最核心的一项。典型错误是：
#   学生问「四级报名费怎么交」，检索到的却是《学费缴费方式》，
#   模型照着学费的流程回答了四级报名费 —— 张冠李戴。
#
# 每一条需要填三样：
#   triggers         触发词：问题里出现这些词就认为涉及本场景
#   allow_documents  文档白名单：本场景只允许引用名字含这些片段的文档
#   conflict_note    冲突说明：资料不匹配时该怎么说
# ------------------------------------------------------------
scenario_constraints:
  - name: 考试报名费
    triggers: [四级, 六级, 报名费, 考试费]
    allow_documents:
      - "*四、六级*"          # 通配符写法，匹配文件名
    conflict_note: 学费缴纳流程不属于考试报名费。若资料里只有学费缴纳流程，
                   请如实说明未找到考试报名费的缴纳方式，并建议咨询教务处。

  - name: 学费住宿费
    triggers: [学费, 住宿费]
    allow_documents:
      - "*缴费方式*"
      - "*统一支付平台*"
    conflict_note: 考试报名费不属于学费缴纳流程。

# ------------------------------------------------------------
# 实体与格式守卫：这三项通常不用改
# ------------------------------------------------------------
entity_guard:
  table_cross_row: true       # 表格 OCR 文本禁止跨行拼接人名与职位/学号
  subject_check: true         # 省略句提问时先核对主语，资料无关就不要硬答
  example_subject: 某某某      # 提示词里作示范用的实体名。填本校真实人名效果最好

# ------------------------------------------------------------
# 材料审查的场景子类型枚举
# 键是场景名，值是给模型的判断线索
# ------------------------------------------------------------
review_scenes:
  票根: 投票票根、选票
  申请表: 申请类材料
  会议记录: 会议记录、会议纪要
  通用: 无法判断的

# ------------------------------------------------------------
# 兜底扩展位：临时出现的新业务约束写在这里，不需要改代码
# 例如：
#   extra_rules:
#     - 涉及「实验室安全考试」时，只允许引用《实验室安全管理办法》。
# ------------------------------------------------------------
extra_rules: []
