# 领域配置：广东工业大学（广工）
#
# 这里放的是「只对某所学校成立」的约束。
# 改造前，这些内容以自然语言形式写死在 main.py 的 system_prompt 里
# （原第 763-766 行「缴费场景强制区分」把文档名写死了，
#   原第 758-759 行把「何华儒」这个人名写死了），
# 换一所学校就必须改代码，且改完没有任何地方能核对改全了没有。
#
# 现在：代码不认识任何一所学校，只负责读这份 YAML 并渲染成提示词。

name: 广东工业大学
alias: [广工, GDUT]

# 机构性信息，注入提示词时一并给出，避免模型对学校名产生歧义
contact_hint: 教务处

# ============================================================
# 业务领域清单（键为规范名，值为给模型的判断线索）
#
# 这份清单原来硬编码在 main.py 的 DOMAIN_TEMPLATES 里，是「换学校要改代码」
# 的最后一处。现在与其它校规一起落在这里，代码不认识任何一所学校。
# ============================================================
# 【不变量】本清单 = 「给模型看的可识别领域」，auto_rules.json = 「真有规则的领域」。
# 两者必须对齐，否则会出两类问题：
#   A. 声明了却零规则、又没有 rule_domain_fallbacks 兜底 → 材料被判到这里时
#      一条硬规则都不适用，结论退化为「无法审查」；
#   B. 有规则却未声明 → 模型识别时永远不会被引导过去，那批规则等于永久失效。
# 因此这里只保留「规则库中确有规则」或「有兜底映射」的领域。
# 后续若上传某领域的制度文件（会自动抽取入库），再把该领域加回本清单即可 ——
# 领域是双向自洽的，不存在「删了就永远长不回来」。
domains:
  奖学金评定: 奖学金申请资格、绩点要求、排名要求、材料清单、评审流程
  团员推优: 推优条件、团员资格、评议流程、票数要求
  综合素质测评: 体质测试、挂科情况、第二课堂时长、品德表现
  考试报名管理: 考试安排、报名资格、报名流程、缴费标准、准考证打印
  四六级考试报名: 大学英语四、六级笔试与口试的资格、时间、缴费和报名要求
  学科竞赛管理: 学科竞赛报名、参赛资格、作品要求、材料提交和评奖流程
  校园艺术活动: 校园艺术活动报名、作品征集、分组要求和材料提交

# ============================================================
# 领域别名表：{模型可能输出的写法: 规则库里的规范名}
#
# 规则库的领域名来自「上传规章文档时」的识别，审查材料时会再识别一次，
# 两次结果常常只差一点。没有这张表就会静默退化成「只用全局规则」。
# 规则引擎本身还会做「互含」兜底，这里补的是语义相近但不互含的情况。
# ============================================================
domain_aliases:
  # 别名目标必须落在「domains 清单 ∪ 规则库领域」内，否则指向空桶
  # （domain_alignment_report 会把这类悬空别名列为错误）。
  奖学金申请: 奖学金评定
  奖学金: 奖学金评定
  评奖评优: 奖学金评定
  推优: 团员推优
  团员推优评议: 团员推优

# 材料名称与制度归档领域不一致时，允许显式使用相关领域的规则。
# 奖学金资格条件目前来自综合素质测评制度，因此在规则库中归档于该领域。
rule_domain_fallbacks:
  奖学金评定: [综合素质测评]
  奖学金申请: [综合素质测评]

# ============================================================
# 场景约束：互斥的办理事项，防止「张冠李戴」
# 每一类给出触发词、允许引用的文档、以及冲突时的说明口径。
# ============================================================
scenario_constraints:
  - name: 考试报名费
    triggers: [四级, 六级, 四六级, CET, 报名费, 考试费, 报考费]
    allow_documents:
      - "*四、六级*"
      - "*四六级*"
    conflict_note: 学费缴纳流程不属于考试报名费。若资料里只有学费缴纳流程，
                   请如实说明未找到考试报名费的缴纳方式，并建议咨询教务处。

  - name: 学费住宿费
    triggers: [学费, 住宿费, 学宿费]
    allow_documents:
      - "*缴费方式*"
      - "*统一支付平台*"
      - "*微信公众号缴费*"
    conflict_note: 考试报名费不属于学费缴纳流程。若资料里只有考试报名费，
                   请如实说明未找到学费缴纳方式。

# ============================================================
# 实体与格式守卫
# ============================================================
entity_guard:
  # 材料由表格 OCR 而来时，禁止跨行拼接人名与职位/学号
  table_cross_row: true
  # 省略句提问时先核对主语，资料与主语无关就不要强行作答
  subject_check: true
  # 提示词里用作示范的实体名（原来写死为「何华儒」，现在从配置取）
  example_subject: 何华儒

# ============================================================
# 审核场景的子类型枚举（材料审查模块识别用）
# ============================================================
review_scenes:
  票根: 投票票根、选票
  申请表: 申请类材料
  推荐表: 推荐类材料
  会议记录: 会议记录、会议纪要
  资格审查表: 资格审查相关
  通知公告: 通知、公告
  通用: 无法判断的

# ============================================================
# 追加到提示词末尾的本校规则。留空即为「无额外规则」。
# 这一项是给后续扩展留的口子：新出现的业务约束直接写在这里，
# 不需要改代码，也不需要重新训练/微调任何东西。
# ============================================================
extra_rules: []
